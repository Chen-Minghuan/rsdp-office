# Domain subpath entry requested by the owner: http://rooom.vip/office/
# Add these locations inside the EXISTING `server` block for rooom.vip on port 80
# (/etc/nginx/sites-available/rooom.vip). The existing static site at / stays untouched.
# Companion container: frontend-office (app baseURL /office/), loopback 127.0.0.1:3002.
# The IP entry on 8081 (nginx-office-http.conf) keeps working with the root-base build.

# Bare /office lands on the SPA root.
location = /office {
    return 301 /office/;
}

# Same login route-guard reason as the 8081 entry (see nginx-office-http.conf):
# the SPA guard only recognises /login, so keep the URL free of a trailing slash.
location = /office/login/ {
    return 302 /office/login$is_args$args;
}

location = /office/login {
    proxy_pass http://127.0.0.1:3002/index.html;
    proxy_set_header Host $http_host;
}

location /office/ {
    rewrite ^/office(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3002;
    proxy_set_header Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Backend stores absolute asset URLs from the request URI (framework forward
    # strategy); the prefix keeps newly recognised underlay URLs under /office/.
    proxy_set_header X-Forwarded-Prefix /office;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 300s;
    client_max_body_size 150m;

    # The container emits relative redirects (absolute_redirect off), e.g. for
    # generated route directories; re-apply the /office prefix for the browser.
    proxy_redirect ~^/((?!office/).*)$ /office/$1;

    # HTTP cannot use a Secure session cookie. Preserve HttpOnly/SameSite;
    # the backend's default remains Secure for the future HTTPS entry point.
    proxy_cookie_flags RSDP_SESSION nosecure;
}

# ---- HTTPS variant (deployed 2026-10-21) ----
# Aliyun DV cert (rooom.vip + www.rooom.vip) at /etc/nginx/ssl/rooom.vip.{pem,key},
# key 0600 root:root. Same locations as the port-80 block above, but:
#   - listen 443 ssl http2; ssl_protocols TLSv1.2 TLSv1.3
#   - NO proxy_cookie_flags nosecure (backend default Secure cookie works on HTTPS)
#   - X-Forwarded-Proto $scheme resolves to https
# The port-80 block stays unchanged; no forced 80->443 redirect per owner request.
