# Temporary HTTP entry point requested by the owner.
# The application and database remain on Docker's internal/loopback interfaces.
server {
    listen 8081;
    listen [::]:8081;
    server_name rooom.vip 101.200.81.123;

    client_max_body_size 150m;

    # Keep the SPA login route at /login. Static-directory redirects to /login/
    # otherwise make the current route guard redirect the login page to itself.
    location = /login/ {
        return 302 /login$is_args$args;
    }

    location = /login {
        proxy_pass http://127.0.0.1:3001/index.html;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;

        # HTTP cannot use a Secure session cookie. Preserve HttpOnly/SameSite;
        # the backend's default remains Secure for the future HTTPS entry point.
        proxy_cookie_flags RSDP_SESSION nosecure;
    }
}
