# Retain the HTTP challenge path in the test ACME virtual host.
server {
    listen 80;
    server_name office-test.rooom.vip rsdp-test.rooom.vip;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rsdp-test-acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name office-test.rooom.vip;
    ssl_certificate /etc/letsencrypt/live/rsdp-test-stack/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rsdp-test-stack/privkey.pem;
    client_max_body_size 64m;
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    server_name rsdp-test.rooom.vip;
    ssl_certificate /etc/letsencrypt/live/rsdp-test-stack/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rsdp-test-stack/privkey.pem;
    client_max_body_size 64m;
    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:3201;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
