server:
  port: 8082

spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: office-product-import
  datasource:
    url: jdbc:postgresql://localhost:5434/office
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-not-delete-value: "null"
      logic-delete-value: "now()"

rsdp:
  render:
    api-key: ${RSDP_RENDER_API_KEY:${DASHSCOPE_API_KEY:}}
    base-url: ${RSDP_RENDER_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    model: ${RSDP_RENDER_MODEL:qwen-image-3.0}
    storage-directory: ${RSDP_RENDER_STORAGE_DIRECTORY:uploads/render-previews}
  cad-parser:
    url: http://127.0.0.1:8091
  vision:
    refine-room-contours: ${RSDP_VISION_REFINE_ROOM_CONTOURS:true}
    url: ${RSDP_VISION_URL:} # 可选：已有识别接口；配置后优先使用
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${RSDP_VISION_MODEL:qwen3-vl-plus}
    max-image-edge: 3072
    pdf-dpi: 144
  import:
    max-file-size: 150MB

logging:
  level:
    com.rsdp.officeproduct.importer: debug
